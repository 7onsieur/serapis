<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Serapis by Limitless Hub{% endblock %}</title>
  <style>
    /* ============================================================
       Serapis by Limitless Hub — design tokens
       A near-black, layered "command centre" system. One accent
       (signal cyan) for brand/interactive elements; status colour
       is reserved for real backend state (NEW/CHANGED/TBC/etc), never
       decoration. No external fonts/scripts: system stacks only.
       ============================================================ */
    :root {
      color-scheme: dark;
      --bg-0: #050506;
      --bg-1: #0a0b0d;
      --bg-2: #101216;
      --bg-3: #16181d;
      --bg-3-hover: #1d2027;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-0: #f5f6f8;
      --text-1: #c6cad4;
      --text-2: #8b90a0;
      --text-3: #5b606f;
      --accent: #4fd8ff;
      --accent-dim: rgba(79, 216, 255, 0.14);
      --accent-glow: rgba(79, 216, 255, 0.45);
      --ok: #3ddc97;
      --ok-dim: rgba(61, 220, 151, 0.14);
      --warn: #f2b73f;
      --warn-dim: rgba(242, 183, 63, 0.14);
      --danger: #ff5c66;
      --danger-dim: rgba(255, 92, 102, 0.14);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --sp-1: 0.5rem;
      --sp-2: 0.75rem;
      --sp-3: 1.1rem;
      --sp-4: 1.75rem;
      --sp-5: 2.5rem;
      --sp-6: 3.5rem;
      --ease: cubic-bezier(.16, .8, .24, 1);
      --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg-0); }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--sans);
      color: var(--text-1);
      background:
        radial-gradient(ellipse 80rem 46rem at 82% -8%, rgba(79, 216, 255, 0.12), transparent 52%),
        radial-gradient(ellipse 60rem 40rem at -5% 18%, rgba(79, 216, 255, 0.07), transparent 55%),
        radial-gradient(ellipse 70rem 40rem at 100% 0%, rgba(61, 220, 151, 0.04), transparent 50%),
        var(--bg-0);
      background-attachment: fixed;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }
    /* faint HUD hairline grid -- pure texture/depth, never a chart */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 60rem 40rem at 50% 0%, black, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 60rem 40rem at 50% 0%, black, transparent 70%);
    }

    .skip-link {
      position: absolute;
      left: -999px;
      top: 0;
      background: var(--accent);
      color: #00131a;
      padding: 0.6rem 1rem;
      border-radius: 0 0 var(--radius-sm) 0;
      font-weight: 600;
      z-index: 100;
    }
    .skip-link:focus { left: 0; }

    a { color: var(--accent); }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    h1, h2, h3, h4 { color: var(--text-0); font-weight: 650; letter-spacing: -0.01em; margin: 0 0 0.4em; }
    h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.35rem); }
    h2 { font-size: 1.15rem; }
    h3 { font-size: 0.98rem; }

    /* ---------- top bar / navigation ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      padding: 0.85rem 1.5rem;
      background: rgba(9, 10, 12, 0.82);
      backdrop-filter: saturate(140%) blur(14px);
      -webkit-backdrop-filter: saturate(140%) blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
    .brand-mark {
      position: relative;
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #eafcff, var(--accent) 55%, #0c5266 100%);
      box-shadow: 0 0 0 1px rgba(79, 216, 255, 0.25), 0 0 14px 1px var(--accent-glow);
      flex: none;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid rgba(79, 216, 255, 0.35);
    }

    /* ---------- Serapis orb (identity element; reserved for a future
       voice surface -- purely decorative/ambient today, never implies
       listening/thinking/processing) ---------- */
    .jarvis-orb {
      position: relative;
      width: var(--orb-size, 1.15rem);
      height: var(--orb-size, 1.15rem);
      flex: none;
      display: grid;
      place-items: center;
    }
    .jarvis-orb .core {
      position: absolute;
      inset: 22%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #f4feff, var(--accent) 52%, #0a4a5c 100%);
      box-shadow: 0 0 0 1px rgba(79, 216, 255, 0.3), 0 0 calc(var(--orb-size, 1.15rem) * 0.9) 1px var(--accent-glow);
    }
    .jarvis-orb .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(79, 216, 255, 0.3);
    }
    .jarvis-orb .ring.r2 { inset: -22%; border-color: rgba(79, 216, 255, 0.14); }
    .jarvis-orb .sweep {
      position: absolute;
      inset: -8%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, rgba(79, 216, 255, 0.55) 18deg, transparent 60deg, transparent 360deg);
      -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2px), black calc(100% - 2px));
      mask: radial-gradient(closest-side, transparent calc(100% - 2px), black calc(100% - 2px));
    }
    .jarvis-orb.lg { --orb-size: 9rem; }
    .jarvis-orb.lg .core { box-shadow: 0 0 0 1px rgba(79, 216, 255, 0.3), 0 0 5rem 0.5rem var(--accent-glow); }
    .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
    .brand-text strong { color: var(--text-0); font-size: 0.92rem; letter-spacing: 0.02em; }
    .brand-text span { color: var(--text-3); font-size: 0.66rem; letter-spacing: 0.09em; text-transform: uppercase; }

    nav.hub-nav {
      display: flex;
      gap: 0.25rem;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0.2rem;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    nav.hub-nav::-webkit-scrollbar { display: none; }
    nav.hub-nav a {
      position: relative;
      flex: none;
      padding: 0.42rem 0.95rem;
      border-radius: 999px;
      color: var(--text-2);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 550;
      transition: color 0.18s var(--ease), background-color 0.18s var(--ease);
      white-space: nowrap;
    }
    nav.hub-nav a:hover { color: var(--text-0); background: var(--bg-3-hover); }
    nav.hub-nav a.active {
      color: #00161c;
      background: var(--accent);
      box-shadow: 0 0 16px -2px var(--accent-glow);
    }

    /* ---------- shell / layout ---------- */
    main { max-width: 68rem; margin: 0 auto; padding: var(--sp-5) 1.5rem var(--sp-6); }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      margin: 0 0 0.5rem;
    }
    .page-head { margin-bottom: var(--sp-5); }
    .page-head p.lede { color: var(--text-2); max-width: 42rem; margin: 0.3rem 0 0; font-size: 0.95rem; }

    .breadcrumb { margin-bottom: var(--sp-3); font-size: 0.85rem; color: var(--text-3); }
    .breadcrumb a { text-decoration: none; color: var(--text-2); }
    .breadcrumb a:hover { color: var(--accent); }

    .section { margin-bottom: var(--sp-5); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: var(--sp-2); flex-wrap: wrap; }
    .section-head .kicker { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
    .section-note { color: var(--text-3); font-size: 0.82rem; margin: 0.2rem 0 var(--sp-3); max-width: 46rem; }

    /* ---------- cards ---------- */
    .card {
      background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--sp-4);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 14px 34px -18px rgba(0, 0, 0, 0.75);
      transition: border-color 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }
    a.card { display: block; text-decoration: none; color: inherit; }
    a.card:hover, a.card:focus-visible {
      border-color: var(--border-strong);
      transform: translateY(-2px);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 22px 46px -20px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(79, 216, 255, 0.12);
    }

    /* ---------- stat tiles ---------- */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 0.85rem; margin-bottom: var(--sp-5); }
    .stat-tile { padding: var(--sp-3) var(--sp-3); }
    .stat-tile .n { font-family: var(--mono); font-size: 1.9rem; font-weight: 600; color: var(--text-0); line-height: 1; }
    .stat-tile .n.accent { color: var(--accent); text-shadow: 0 0 18px var(--accent-glow); }
    .stat-tile .label { margin-top: 0.35rem; font-size: 0.76rem; color: var(--text-2); }

    /* ---------- module grid ---------- */
    .module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.9rem; }
    .module-card .code { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; }
    .module-card h3 { margin: 0.3rem 0 0.6rem; }
    .module-card .meta { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.7rem; }

    /* ---------- status chips (tag) ---------- */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      color: var(--text-1);
      background: var(--bg-2);
      margin: 0.1rem 0.3rem 0.1rem 0;
      white-space: nowrap;
    }
    .tag.tbc { color: var(--warn); border-color: rgba(242, 183, 63, 0.4); background: var(--warn-dim); font-weight: 650; }
    .tag.status-new, .tag.status-changed { color: var(--ok); border-color: rgba(61, 220, 151, 0.4); background: var(--ok-dim); }
    .tag.status-new::before { content: ""; width: 0.4rem; height: 0.4rem; border-radius: 50%; background: currentColor; }
    .tag.status-unchanged { color: var(--text-2); }
    .tag.status-failed { color: var(--danger); border-color: rgba(255, 92, 102, 0.4); background: var(--danger-dim); }
    .tag.status-ambiguous, .tag.status-not_yet_published { color: var(--warn); border-color: rgba(242, 183, 63, 0.35); background: var(--warn-dim); }
    .tag.week-status { color: var(--text-3); background: transparent; }

    .unknown { font-style: italic; color: var(--text-3); }
    .empty { color: var(--text-2); font-size: 0.92rem; }

    /* ---------- tables ---------- */
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      margin-bottom: var(--sp-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-2);
    }
    table { border-collapse: collapse; width: 100%; min-width: 28rem; margin-bottom: 0; }
    th {
      text-align: left;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      padding: 0.7rem 0.9rem;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 0.65rem 0.9rem; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 0.9rem; color: var(--text-1); }
    tr:last-child td { border-bottom: none; }
    .table-roomy td { padding: 1.1rem 1rem; font-size: 0.98rem; }
    .table-roomy td.title-cell { color: var(--text-0); font-weight: 600; }
    .table-roomy td .module-pill { font-family: var(--mono); font-size: 0.72rem; color: var(--accent); }
    tbody tr { transition: background-color 0.15s var(--ease); }
    tbody tr:hover { background: var(--bg-3-hover); }
    td a { text-decoration: none; }
    td a:hover { text-decoration: underline; }

    /* ---------- forms / actions ---------- */
    .action-grid { display: grid; grid-template-columns: 1fr; gap: var(--sp-3); }
    @media (min-width: 48rem) {
      .action-grid { grid-template-columns: 1fr 1fr; align-items: start; }
      .action-grid .action-form.wide { grid-column: 1 / -1; }
    }
    .action-form {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--sp-3) var(--sp-4);
      margin-bottom: var(--sp-3);
      background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
      transition: border-color 0.2s var(--ease);
    }
    .action-form:focus-within, .action-form:hover { border-color: var(--border-strong); }
    .action-form h3 { margin: 0 0 0.3rem; display: flex; align-items: center; gap: 0.5rem; }
    .action-form .badge {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      color: var(--text-2);
    }
    .action-form .badge.writes { color: var(--warn); border-color: rgba(242, 183, 63, 0.4); }
    .action-form .badge.ephemeral { color: var(--accent); border-color: rgba(79, 216, 255, 0.35); }
    .action-form p.note { margin: 0.35rem 0 0.8rem; font-size: 0.82rem; color: var(--text-3); }
    .action-form label { display: block; margin-bottom: 0.55rem; font-size: 0.85rem; color: var(--text-2); }
    .action-form input[type="text"], .action-form textarea {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      color: var(--text-0);
      background: var(--bg-1);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 0.55rem 0.7rem;
      margin-top: 0.3rem;
      transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
    }
    .action-form input[type="text"]:focus, .action-form textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    button, .btn {
      appearance: none;
      border: 1px solid rgba(79, 216, 255, 0.5);
      background: linear-gradient(180deg, rgba(79, 216, 255, 0.22), rgba(79, 216, 255, 0.1));
      color: var(--text-0);
      font: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: transform 0.15s var(--ease), box-shadow 0.2s var(--ease), background-color 0.2s var(--ease);
    }
    button:hover:not(:disabled) { box-shadow: 0 0 22px -4px var(--accent-glow); transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled {
      cursor: progress;
      opacity: 0.75;
      animation: pulse-working 1.1s ease-in-out infinite;
    }

    .action-result {
      border: 1px solid rgba(61, 220, 151, 0.35);
      background: var(--ok-dim);
      border-radius: var(--radius-md);
      padding: var(--sp-3);
      margin-bottom: var(--sp-4);
    }
    .action-result strong { color: var(--ok); }
    .action-error {
      border: 1px solid rgba(255, 92, 102, 0.4);
      background: var(--danger-dim);
      border-radius: var(--radius-md);
      padding: var(--sp-3);
      margin-bottom: var(--sp-4);
    }
    .action-error strong { color: var(--danger); }
    .action-result ul, .action-error ul { margin: 0.4rem 0 0; padding-left: 1.1rem; color: var(--text-1); font-size: 0.88rem; }

    .rendered-output {
      white-space: pre-wrap;
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--text-1);
      background: var(--bg-1);
      border: 1px solid var(--border);
      padding: var(--sp-3);
      border-radius: var(--radius-md);
      margin-top: 0.7rem;
      max-height: 34rem;
      overflow-y: auto;
    }

    /* ---------- hero (Home command-centre composition) ---------- */
    .hero {
      display: grid;
      grid-template-columns: 1.3fr auto;
      align-items: center;
      gap: var(--sp-5);
      padding: var(--sp-5) var(--sp-5);
      margin-bottom: var(--sp-5);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background:
        radial-gradient(ellipse 40rem 26rem at 100% 0%, rgba(79, 216, 255, 0.14), transparent 60%),
        linear-gradient(180deg, var(--bg-3), var(--bg-1));
      position: relative;
      overflow: hidden;
    }
    .hero .headline-stat { font-family: var(--mono); font-size: 3.4rem; font-weight: 650; color: var(--text-0); line-height: 1; text-shadow: 0 0 26px var(--accent-glow); }
    .hero .headline-stat .unit { font-size: 1rem; color: var(--text-2); font-weight: 500; margin-left: 0.4rem; text-shadow: none; }
    .hero-orb-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
    .hero-orb-wrap .caption { font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }

    .accent-line {
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      background-size: 60% 100%;
      background-repeat: no-repeat;
      opacity: 0.8;
      margin: 0.9rem 0 1.2rem;
    }

    /* ---------- feature panel (asymmetric Home attention block) ---------- */
    .feature-panel {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: var(--sp-4);
      align-items: center;
      padding: var(--sp-4);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: linear-gradient(135deg, var(--bg-3), var(--bg-2));
    }
    .feature-panel .status-dot { width: 0.85rem; height: 0.85rem; border-radius: 50%; background: var(--text-3); box-shadow: 0 0 0 4px rgba(255,255,255,0.03); flex: none; }
    .feature-panel .status-dot.live { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim), 0 0 16px var(--accent-glow); }
    .feature-panel .status-dot.clear { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-dim), 0 0 16px rgba(61,220,151,0.5); }
    .feature-panel h2 { margin: 0 0 0.3rem; }

    /* ---------- provenance chip (student label + technical tooltip) ---------- */
    .provenance-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-1);
      background: var(--bg-1);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 0.2rem 0.6rem 0.2rem 0.5rem;
      margin: 0.1rem 0.3rem 0.1rem 0;
      cursor: help;
    }
    .provenance-chip .dot { width: 0.4rem; height: 0.4rem; border-radius: 50%; background: var(--accent); }
    .provenance-chip.ledger .dot { background: var(--ok); }

    /* ---------- module cards, large (Modules index) ---------- */
    .module-grid-lg { display: grid; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); gap: 1.25rem; }
    .module-card-lg {
      position: relative;
      padding: var(--sp-5) var(--sp-4) var(--sp-4);
      overflow: hidden;
    }
    .module-card-lg::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent 70%);
      opacity: 0.7;
    }
    .module-card-lg .code { font-family: var(--mono); font-size: 2.1rem; font-weight: 650; letter-spacing: 0.01em; color: var(--text-0); line-height: 1; }
    .module-card-lg .code .glow { color: var(--accent); text-shadow: 0 0 24px var(--accent-glow); }
    .module-card-lg h3 { margin: 0.5rem 0 0.9rem; font-size: 1.05rem; color: var(--text-1); font-weight: 550; }
    .module-card-lg .meta { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .module-card-lg .enter { margin-top: 1.1rem; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 0.3rem; }
    .module-card-lg .enter .arrow { transition: transform 0.2s var(--ease); }
    .module-card-lg:hover .enter .arrow { transform: translateX(4px); }

    /* ---------- Serapis response card (generated output) ---------- */
    .response-card { margin-top: 0.8rem; }
    .response-card .response-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .response-card .response-label .dot { width: 0.4rem; height: 0.4rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
    .response-card .rendered-output { border-left: 2px solid var(--accent); border-radius: 0 var(--radius-md) var(--radius-md) 0; }

    /* ---------- sync pipeline (Check University, static -- never implies a live sync) ---------- */
    .sync-pipeline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: var(--sp-3) 0 var(--sp-4);
      padding: var(--sp-3);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--bg-2);
    }
    .sync-pipeline .node { flex: 1; text-align: center; }
    .sync-pipeline .node .glyph {
      width: 2.4rem; height: 2.4rem; margin: 0 auto 0.5rem;
      border-radius: 50%;
      display: grid; place-items: center;
      border: 1px solid var(--border-strong);
      background: var(--bg-1);
      font-family: var(--mono);
      color: var(--text-2);
    }
    .sync-pipeline .node.you .glyph { color: var(--text-1); }
    .sync-pipeline .node.jarvis .glyph { color: var(--accent); border-color: rgba(79,216,255,0.4); box-shadow: 0 0 18px -4px var(--accent-glow); }
    .sync-pipeline .node .label { font-size: 0.76rem; color: var(--text-2); }
    .sync-pipeline .connector { flex: none; width: 3rem; height: 1px; background: linear-gradient(90deg, var(--border-strong), var(--border-strong)); position: relative; top: -0.9rem; }

    footer.hub-footer { text-align: center; color: var(--text-3); font-size: 0.75rem; padding: var(--sp-5) 1.5rem; }

    /* ---------- motion ---------- */
    @keyframes pulse-working { 0%, 100% { opacity: 0.75; } 50% { opacity: 0.45; } }
    @keyframes orb-pulse { 0%, 100% { box-shadow: 0 0 0 1px rgba(79,216,255,0.25), 0 0 14px 1px var(--accent-glow); } 50% { box-shadow: 0 0 0 1px rgba(79,216,255,0.4), 0 0 22px 4px var(--accent-glow); } }
    @keyframes fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes orb-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orb-breathe { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes line-sweep { 0%, 100% { background-position: -120% 0; } 50% { background-position: 220% 0; } }

    @media (prefers-reduced-motion: no-preference) {
      .brand-mark { animation: orb-pulse 3.2s ease-in-out infinite; }
      .jarvis-orb .core { animation: orb-pulse 3.6s ease-in-out infinite; }
      .jarvis-orb .sweep { animation: orb-spin 7s linear infinite; }
      .jarvis-orb .ring.r2 { animation: orb-breathe 5s ease-in-out infinite; }
      main > * { animation: fade-up 0.5s var(--ease) both; }
      main > *:nth-child(2) { animation-delay: 0.05s; }
      main > *:nth-child(3) { animation-delay: 0.1s; }
      main > *:nth-child(4) { animation-delay: 0.15s; }
      main > *:nth-child(5) { animation-delay: 0.2s; }
      .accent-line { animation: line-sweep 4.5s ease-in-out infinite; }
    }

    @media (max-width: 40rem) {
      .topbar { padding: 0.7rem 1rem; }
      main { padding: var(--sp-4) 1rem var(--sp-6); }
      .brand-text span { display: none; }
    }

    @media (max-width: 48rem) {
      .hero { grid-template-columns: 1fr; padding: var(--sp-4); text-align: center; }
      .hero-orb-wrap { order: -1; }
      .jarvis-orb.lg { --orb-size: 6rem; }
      .hero .headline-stat { font-size: 2.4rem; }
      .feature-panel { grid-template-columns: auto 1fr; padding: var(--sp-3); }
      .module-grid-lg { grid-template-columns: 1fr; }
      .sync-pipeline { flex-direction: column; }
      .sync-pipeline .connector { display: none; }
      .sync-pipeline .node { margin-bottom: 0.5rem; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text"><strong>Serapis</strong><span>Study Hub</span></span>
    </a>
    <nav class="hub-nav" aria-label="Primary">
      <a href="/" class="{{ 'active' if active_nav == 'home' else '' }}">Home</a>
      <a href="/modules" class="{{ 'active' if active_nav == 'modules' else '' }}">Modules</a>
      <a href="/assessments" class="{{ 'active' if active_nav == 'assessments' else '' }}">Assessments</a>
      <a href="/check" class="{{ 'active' if active_nav == 'check' else '' }}">Check</a>
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="hub-footer">Serapis by Limitless — local, evidence-grounded; check generated claims against their sources.</footer>
  <script>
    // Minimal, framework-free feedback: disable the submit button and show
    // "Working..." while a model/external action request is in flight. No
    // progress percentage or completion estimate -- just "this is running".
    document.querySelectorAll(".action-form form, #check-form").forEach(function (form) {
      form.addEventListener("submit", function () {
        var button = form.querySelector("button[type='submit']");
        if (button && !button.disabled) {
          button.disabled = true;
          button.textContent = "Working…";
        }
      });
    });
  </script>
</body>
</html>
