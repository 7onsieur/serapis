[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serapis"
version = "0.1.0"
description = "A local-first academic workflow assistant"
license = { text = "Apache-2.0" }
authors = [{ name = "Selom Topanou" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "jinja2>=3,<4",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
ai = ["openai>=2,<3"]
blackboard = ["playwright>=1.40,<2"]
drive = ["google-api-python-client>=2,<3", "google-auth-oauthlib>=1,<2", "google-auth-httplib2>=0.4,<1"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
serapis = "university_jarvis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
university_jarvis = ["hub_templates/*.html"]
